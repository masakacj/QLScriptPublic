; Quantumult X - dedicated, proxy-free Cookie Capture profile
; Revision 2026-10-30. No node subscription, no private keys.
; Enable QX VPN/Tunnel, Rewrite, MitM, and HTTP task interactions manually.
; DO NOT paste CAPTURE_TOKEN here. Run setup-online.js once with a local token.
; Aliyun + Kuaishou domains are for manual QX HTTP inspection only.
; No automatic raw credential upload; certificate-pinned apps may reject MitM.
; Reuse your existing QX profile/CA; do not replace private CA settings.
; QX MitM CA certificate remains on your device; generate/trust in QX settings.
;
[general]
dns_exclusion_list = mcs-mimp-web.sf-express.com, mina.bydoceanauto.com, wx.10086.cn, drive-m.quark.cn, auth.aliyundrive.com, auth.alipan.com, nebula.kuaishou.com, qlcap.781751.xyz

[dns]
; Keep the system DNS of the current network.

[policy]

[server_local]

[server_remote]

[filter_local]
host-suffix, sf-express.com, direct
host, mina.bydoceanauto.com, direct
host, wx.10086.cn, direct
host, drive-m.quark.cn, direct
host, auth.aliyundrive.com, direct
host, auth.alipan.com, direct
host, nebula.kuaishou.com, direct
host, qlcap.781751.xyz, direct
final, direct

[filter_remote]

[rewrite_local]

[rewrite_remote]
https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/rewrite.conf, tag=QL Cookie Capture, update-interval=86400, opt-parser=false, enabled=true

[task_local]
event-interaction https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/setup-online.js, tag=QL Setup, enabled=true
event-interaction https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/status.js, tag=QL Status, enabled=true
event-interaction https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/arm.js, tag=QL Arm, enabled=true
event-interaction https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/disarm.js, tag=QL Disarm, enabled=true

*/5 * * * * https://qlcap.781751.xyz:58443/qx/recovery-notice.js, tag=QL Recovery Notice, enabled=true

[mitm]
hostname = mcs-mimp-web.sf-express.com, mina.bydoceanauto.com, wx.10086.cn, drive-m.quark.cn, auth.aliyundrive.com, auth.alipan.com, nebula.kuaishou.com
