# Qinglong Cookie Capture for Quantumult X (remote rewrite resource)
# Import this URL under Rewrite > Remote Resources. Do not use as a full profile.
# Explicit domain only; intercept only when one-shot capture is armed.
hostname = mcs-mimp-web.sf-express.com, mina.bydoceanauto.com
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js

# BYD Ocean: encrypted login response is stored only in local QX prefs; no remote upload.
^https:\/\/mina\.bydoceanauto\.com\/\?service=mina\.decryptCode(?:&|$) url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js

# BYD signed request contains encrypted session_id. Read only, never replay sign-in.
^https:\/\/mina\.bydoceanauto\.com\/\?s=ForCommonUcSrv\.forward&serviceDir=activity\/sign\/signIn(?:&|$) url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js

# Passive BYD diagnostic: request-header hook works even if a response never arrives.
# Exclude the exact login/sign-in body rules above; do not alter headers or request bodies.
^https:\/\/mina\.bydoceanauto\.com\/(?!\?service=mina\.decryptCode(?:&|$)|\?s=ForCommonUcSrv\.forward&serviceDir=activity\/sign\/signIn(?:&|$)) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js
