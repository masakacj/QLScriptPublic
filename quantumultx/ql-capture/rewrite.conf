# Qinglong Cookie Capture for Quantumult X (remote rewrite resource)
# Import this URL under Rewrite > Remote Resources. Do not use as a full profile.
# Default-on credential capture whenever QX Tunnel + Rewrite + MitM are active.
# Optional QL Disarm pauses; the separate raw HTTP trace remains opt-in.
# Aliyun/Kuaishou hooks use the EXISTING capture.js, with local-only status metadata.
# No new token/Cookie values are uploaded, logged, or written into QingLong.
hostname = mcs-mimp-web.sf-express.com, mina.bydoceanauto.com, wx.10086.cn, drive-m.quark.cn, auth.aliyundrive.com, auth.alipan.com, nebula.kuaishou.com
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js

# BYD Ocean body-first diagnostic. QX may apply only the first matching
# rewrite per request/response direction. These two hooks also expose
# $request.headers / $response.headers, status and sessionIndex.
# All 58 observed BYD POST requests had nonempty JSON bodies.
^https:\/\/mina\.bydoceanauto\.com\/ url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=152#trace=reqb
^https:\/\/mina\.bydoceanauto\.com\/ url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=152#trace=rsb

# China Mobile: passive QX local Cookie capture (YYB handles the live QL task).
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/mark\/(?:mark31\/domark|do\/mark|info\/prizeInfo)(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/china-mobile.js?v=200

# Aliyun Drive: local-only response metadata; original JSON body unchanged.
^https:\/\/(?:auth\.aliyundrive\.com|auth\.alipan\.com)\/v2\/account\/token(?:\?|$) url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=154

# Kuaishou Lite: local-only request hit/Cookie-header-presence metadata.
^https:\/\/nebula\.kuaishou\.com\/rest\/n\/nebula\/(?:activity\/earn\/overview|sign\/query)(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=154

# Quark cloud drive: capture only mobile growth/reward request query auth (no other headers/body).
^https:\/\/drive-m\.quark\.cn\/1\/clouddrive\/(?:act\/growth\/reward|capacity\/growth\/(?:info|sign))(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/quark.js?v=200
