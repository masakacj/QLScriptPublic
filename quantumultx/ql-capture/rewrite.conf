# Qinglong Cookie Capture for Quantumult X (remote rewrite resource)
# Import this URL under Rewrite > Remote Resources. Do not use as a full profile.
# Default-on credential capture whenever QX Tunnel + Rewrite + MitM are active.
# Optional QL Disarm pauses; the separate raw HTTP trace remains opt-in.
# Aliyun/Kuaishou use the existing capture.js with structured four-stage diagnosis.
# Header names, JSON keys and sizes only; no new credential values are uploaded.
hostname = mcs-mimp-web.sf-express.com, mina.bydoceanauto.com, wx.10086.cn, drive-m.quark.cn, auth.aliyundrive.com, auth.alipan.com, nebula.kuaishou.com, *.ikea.cn, *.aliyundrive.com, *.alipan.com, aliyundrive.com, alipan.com, open.aliyundrive.com, user.aliyundrive.com, api.aliyundrive.com, member.aliyundrive.com, cn-beijing-data.aliyundrive.net, ynuf.aliapp.org
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js
^https:\/\/mcs-mimp-web\.sf-express\.com\/(?:mcs-mimp\/|home|superWelfare) url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js

# BYD Ocean body-first diagnostic. QX may apply only the first matching
# rewrite per request/response direction. These two hooks also expose
# $request.headers / $response.headers, status and sessionIndex.
# All 58 observed BYD POST requests had nonempty JSON bodies.
^https:\/\/mina\.bydoceanauto\.com\/ url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=152#trace=reqb
^https:\/\/mina\.bydoceanauto\.com\/ url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=152#trace=rsb

# China Mobile: passive QX local Cookie capture (YYB handles the live QL task).
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/mark\/(?:mark31\/domark|do\/mark|info\/prizeInfo)(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/china-mobile.js?v=200

# Aliyun Drive: request/response headers and JSON shape, no credential values.
^https:\/\/(?:auth\.aliyundrive\.com|auth\.alipan\.com)\/v2\/account\/ url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=159#shape=reqb
^https:\/\/(?:auth\.aliyundrive\.com|auth\.alipan\.com)\/v2\/account\/ url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=159#shape=rsb

# Aliyun Drive miniapp: temporary 45-min/day endpoint discovery (only paths,
# query/header NAMES, status and public WeChat AppID; no tokens/cookies/bodies).
# Place AFTER legacy /v2/account rules; those retain their existing schema hook.
^https:\/\/(?:[a-z0-9-]+\.)*(?:aliyundrive|alipan)\.com\/ url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/alipan-discover.js?v=102
^https:\/\/(?:[a-z0-9-]+\.)*(?:aliyundrive|alipan)\.com\/ url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/alipan-discover.js?v=102

# Two exact additional hosts observed in the user's Stream capture.
# These are metadata-only; no content, tokens or cookies leave the phone.
^https:\/\/(?:cn-beijing-data\.aliyundrive\.net|ynuf\.aliapp\.org)\/ url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/alipan-discover.js?v=102
^https:\/\/(?:cn-beijing-data\.aliyundrive\.net|ynuf\.aliapp\.org)\/ url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/alipan-discover.js?v=102

# Kuaishou Lite: request/response headers and JSON shape, no credential values.
^https:\/\/nebula\.kuaishou\.com\/rest\/n\/nebula\/ url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=159#shape=reqb
^https:\/\/nebula\.kuaishou\.com\/rest\/n\/nebula\/ url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/capture.js?v=159#shape=rsb

# Quark cloud drive: capture only mobile growth/reward request query auth (no other headers/body).
^https:\/\/drive-m\.quark\.cn\/1\/clouddrive\/(?:act\/growth\/reward|capacity\/growth\/(?:info|sign))(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/quark.js?v=200

# IKEA login: scoped JSON schema only; capture no actual login code or token.
# Place BEFORE generic IKEA header hooks: QX applies the first matching rewrite.
^https:\/\/bff\.app\.ikea\.cn\/customer-bff\/v1\.0\/customer\/auth\/wechat(?:\?|$) url script-request-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea-login-structure.js?v=110#ikeaLogin=req
^https:\/\/bff\.app\.ikea\.cn\/customer-bff\/v1\.0\/customer\/auth\/wechat(?:\?|$) url script-response-body https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea-login-structure.js?v=110#ikeaLogin=res

# IKEA authorization: capture only GET to the daily activity endpoint.
# Runs before generic IKEA request-header metadata hook.
^https:\/\/bff\.app\.ikea\.cn\/customer-bff\/(?:v3\.0\/activity(?:\/participants)?|customer\/(?:info|profile\/get)|point\/benefit\/summary)(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea-auth.js?v=112

# IKEA CIAM member profile GET: observed after entering membership page.
# Dedicated bearer-only capture, before generic IKEA metadata hook.
^https:\/\/ciam\.family\.ikea\.cn\/ciam\/crbff\/profile\/auth\/customer\/profile\/get(?:\?|$) url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea-auth.js?v=112

# IKEA China: time-boxed metadata-only endpoint discovery (no cookies/bodies).
# Refresh QX Rewrite resource and append *.ikea.cn to existing MitM hostnames.
^https:\/\/(?:[a-z0-9-]+\.)*ikea\.cn\/ url script-request-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea.js?v=102
^https:\/\/(?:[a-z0-9-]+\.)*ikea\.cn\/ url script-response-header https://raw.githubusercontent.com/masakacj/QLScriptPublic/main/quantumultx/ql-capture/ikea.js?v=102
